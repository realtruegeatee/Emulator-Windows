<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A lightweight Windows desktop emulator running in your browser.">
  <title>Emulator-Windows</title>
  <style>
    :root {
      --accent: #0067c0;
      --surface: #f9f9f9;
      --text: #202020;
      --taskbar: rgba(243, 243, 243, .82);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: #0c2d5a;
      color: var(--text);
      font: 14px "Segoe UI", Tahoma, sans-serif;
      overflow: hidden;
    }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }

    #desktop {
      background:
        radial-gradient(ellipse at 68% 52%, rgba(119, 205, 255, .9) 0%, rgba(43, 126, 201, .7) 22%, transparent 48%),
        radial-gradient(ellipse at 50% 70%, rgba(37, 105, 179, .9), transparent 62%),
        linear-gradient(140deg, #0b2f6d 0%, #1672b9 48%, #071f50 100%);
      height: calc(100% - 58px);
      overflow: hidden;
      position: relative;
    }
    #desktop::before {
      background:
        linear-gradient(115deg, transparent 42%, rgba(255,255,255,.22) 42.2%, transparent 43%),
        radial-gradient(ellipse at center, rgba(255,255,255,.16), transparent 58%);
      content: "";
      inset: 0;
      pointer-events: none;
      position: absolute;
    }
    .desktop-icon {
      align-items: center;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      color: #fff;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 6px 2px;
      position: absolute;
      text-shadow: 0 1px 3px rgba(0,0,0,.8);
      width: 82px;
      z-index: 1;
    }
    .desktop-icon:hover, .desktop-icon:focus-visible {
      background: rgba(255,255,255,.18);
      border-color: rgba(255,255,255,.45);
      outline: none;
    }
    .desktop-icon.dragging { opacity: .7; }
    .desktop-icon .glyph {
      align-items: center;
      background: linear-gradient(145deg, #fff, #dce8f5);
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,.35);
      color: var(--accent);
      display: flex;
      font-size: 25px;
      height: 45px;
      justify-content: center;
      line-height: 1;
      text-shadow: none;
      width: 45px;
    }

    .window {
      background: var(--surface);
      border: 1px solid rgba(255,255,255,.7);
      border-radius: 8px;
      box-shadow: 0 18px 45px rgba(0,0,0,.42);
      display: none;
      flex-direction: column;
      left: 50%;
      max-height: calc(100% - 24px);
      max-width: calc(100% - 24px);
      min-height: 190px;
      min-width: 290px;
      overflow: hidden;
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      backdrop-filter: blur(18px);
      width: 460px;
      z-index: 10;
    }
    .window.open { display: flex; }
    .window.active { z-index: 20; }
    .window.dragging { opacity: .92; }
    .titlebar {
      align-items: center;
      background: rgba(255,255,255,.92);
      color: #202020;
      display: flex;
      gap: 8px;
      min-height: 42px;
      padding: 0 6px 0 14px;
      user-select: none;
    }
    .titlebar strong { flex: 1; }
    .titlebar button {
      background: transparent;
      border: 0;
      color: inherit;
      font-size: 20px;
      height: 30px;
      line-height: 1;
      width: 32px;
    }
    .titlebar button:hover { background: #c42b1c; color: #fff; }
    .window-body { flex: 1; overflow: auto; padding: 14px; }
    .window-footer {
      background: rgba(235,235,235,.9);
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      padding: 9px 12px;
    }
    .window-footer button, .settings button {
      border: 1px solid #b8b8b8;
      border-radius: 4px;
      padding: 6px 14px;
    }
    .primary { background: var(--accent); border-color: var(--accent) !important; color: #fff; }
    .notepad-area {
      border: 1px solid #aaa;
      display: block;
      min-height: 260px;
      padding: 10px;
      resize: none;
      width: 100%;
    }
    .calc-display {
      background: #fff;
      border: 1px solid #aaa;
      font-size: 26px;
      margin-bottom: 10px;
      padding: 8px;
      text-align: right;
      width: 100%;
    }
    .calc-grid { display: grid; gap: 6px; grid-template-columns: repeat(4, 1fr); }
    .calc-grid button { border: 1px solid #bbb; border-radius: 3px; padding: 12px 4px; }
    .calc-grid button:hover { background: #ddd; }
    .settings { display: grid; gap: 14px; }
    .settings label { align-items: center; display: flex; justify-content: space-between; }
    .error { color: #a4262c; min-height: 20px; }
    .toolbar { align-items: center; display: flex; gap: 8px; margin-bottom: 12px; }
    .toolbar button, .toolbar input, .file-row button, .store-card button {
      border: 1px solid #b8b8b8;
      border-radius: 4px;
      padding: 6px 10px;
    }
    .file-list { display: grid; gap: 6px; }
    .file-row {
      align-items: center;
      background: rgba(255,255,255,.72);
      border: 1px solid #ddd;
      border-radius: 4px;
      display: flex;
      gap: 10px;
      justify-content: space-between;
      padding: 9px 10px;
    }
    .file-row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .store-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
    .store-card { background: rgba(255,255,255,.72); border: 1px solid #ddd; border-radius: 6px; padding: 12px; }
    .store-card h3 { margin: 0 0 6px; }
    .store-card p { color: #555; min-height: 38px; margin: 0 0 10px; }
    .installed { color: #287c2b; font-size: 12px; }

    #start-menu {
      background: rgba(248,248,248,.88);
      border: 1px solid rgba(255,255,255,.75);
      border-radius: 8px;
      bottom: 58px;
      box-shadow: 0 18px 45px rgba(0,0,0,.4);
      backdrop-filter: blur(25px);
      display: none;
      left: 50%;
      padding: 18px;
      position: absolute;
      transform: translateX(-50%);
      width: 360px;
      z-index: 100;
    }
    #start-menu.open { display: block; }
    #start-menu h2 { font-size: 18px; margin: 2px 8px 14px; }
    .app-launcher {
      background: transparent;
      border: 0;
      border-radius: 3px;
      display: block;
      padding: 11px 12px;
      text-align: left;
      width: 100%;
    }
    .app-launcher:hover, .app-launcher:focus-visible { background: #e5f1fb; outline: none; }

    #taskbar {
      align-items: center;
      background: var(--taskbar);
      border-top: 1px solid rgba(255,255,255,.55);
      box-shadow: 0 -4px 18px rgba(0,0,0,.18);
      bottom: 0;
      color: #fff;
      display: flex;
      gap: 7px;
      height: 58px;
      justify-content: center;
      padding: 0 12px;
      position: absolute;
      width: 100%;
      z-index: 200;
    }
    #start-button, #clock {
      color: inherit;
      white-space: nowrap;
    }
    #start-button {
      background: transparent;
      border: 0;
      border-radius: 3px;
      font-size: 25px;
      line-height: 1;
      padding: 7px 10px;
    }
    #start-button:hover, #start-button:focus-visible { background: rgba(255,255,255,.18); outline: none; }
    #search {
      background: rgba(255,255,255,.72);
      border: 1px solid rgba(0,0,0,.15);
      border-radius: 18px;
      max-width: 240px;
      padding: 8px 14px;
      width: 220px;
    }
    #clock {
      color: #202020;
      font-size: 12px;
      left: auto;
      margin-left: 18px;
      padding: 0 8px;
      position: absolute;
      right: 12px;
    }
    @media (max-width: 520px) {
      #search { width: 150px; }
      .window { min-width: 0; width: calc(100% - 24px); }
    }
  </style>
</head>
<body>
  <main id="desktop" aria-label="Windows desktop">
    <button class="desktop-icon" data-app="notepad" style="left: 18px; top: 18px;">
      <span class="glyph" aria-hidden="true">📝</span><span>Notepad</span>
    </button>
    <button class="desktop-icon" data-app="calculator" style="left: 18px; top: 112px;">
      <span class="glyph" aria-hidden="true">🧮</span><span>Calculator</span>
    </button>
    <button class="desktop-icon" data-app="settings" style="left: 18px; top: 206px;">
      <span class="glyph" aria-hidden="true">⚙️</span><span>Settings</span>
    </button>
    <button class="desktop-icon" data-app="explorer" style="left: 18px; top: 300px;">
      <span class="glyph" aria-hidden="true">📁</span><span>File Explorer</span>
    </button>
    <button class="desktop-icon" data-app="store" style="left: 18px; top: 394px;">
      <span class="glyph" aria-hidden="true">🛍️</span><span>App Store</span>
    </button>

    <section class="window" id="window-notepad" aria-labelledby="notepad-title">
      <header class="titlebar">
        <strong id="notepad-title">📝 Notepad</strong>
        <button class="close-window" aria-label="Close Notepad">×</button>
      </header>
      <div class="window-body"><textarea class="notepad-area" aria-label="Notepad text" placeholder="Type here..."></textarea></div>
      <footer class="window-footer"><button class="clear-notes">Clear</button><button class="primary save-notes">Save</button></footer>
    </section>

    <section class="window" id="window-calculator" aria-labelledby="calculator-title">
      <header class="titlebar">
        <strong id="calculator-title">🧮 Calculator</strong>
        <button class="close-window" aria-label="Close Calculator">×</button>
      </header>
      <div class="window-body">
        <input id="calc-display" class="calc-display" aria-label="Calculator display" readonly>
        <div class="calc-grid">
          <button data-calc="7">7</button><button data-calc="8">8</button><button data-calc="9">9</button><button data-calc="/">÷</button>
          <button data-calc="4">4</button><button data-calc="5">5</button><button data-calc="6">6</button><button data-calc="*">×</button>
          <button data-calc="1">1</button><button data-calc="2">2</button><button data-calc="3">3</button><button data-calc="-">−</button>
          <button data-calc="0">0</button><button data-calc=".">.</button><button data-calc="=">=</button><button data-calc="+">+</button>
        </div>
        <p class="error" id="calc-error" role="alert"></p>
      </div>
      <footer class="window-footer"><button id="calc-clear">Clear</button></footer>
    </section>

    <section class="window" id="window-settings" aria-labelledby="settings-title">
      <header class="titlebar">
        <strong id="settings-title">⚙️ Settings</strong>
        <button class="close-window" aria-label="Close Settings">×</button>
      </header>
      <div class="window-body settings">
        <label>Accent color <input id="accent-color" type="color" value="#0078d4"></label>
        <label>High contrast <input id="contrast-toggle" type="checkbox"></label>
        <p>Changes are saved in this browser.</p>
      </div>
    </section>
    <section class="window" id="window-explorer" aria-labelledby="explorer-title">
      <header class="titlebar">
        <strong id="explorer-title">📁 File Explorer</strong>
        <button class="close-window" aria-label="Close File Explorer">×</button>
      </header>
      <div class="window-body">
        <div class="toolbar">
          <button id="upload-file">Upload file</button>
          <input id="file-picker" type="file" hidden>
          <button id="new-file">New text file</button>
        </div>
        <div class="file-list" id="file-list"></div>
      </div>
    </section>
    <section class="window" id="window-store" aria-labelledby="store-title">
      <header class="titlebar">
        <strong id="store-title">🛍️ App Store</strong>
        <button class="close-window" aria-label="Close App Store">×</button>
      </header>
      <div class="window-body">
        <p>Install apps into this browser-based Windows environment.</p>
        <div class="store-grid" id="store-grid"></div>
      </div>
    </section>
  </main>

  <nav id="start-menu" aria-label="Start menu">
    <h2>Emulator-Windows</h2>
    <button class="app-launcher" data-app="notepad">📝 &nbsp; Notepad</button>
    <button class="app-launcher" data-app="calculator">🧮 &nbsp; Calculator</button>
    <button class="app-launcher" data-app="settings">⚙️ &nbsp; Settings</button>
    <button class="app-launcher" data-app="explorer">📁 &nbsp; File Explorer</button>
    <button class="app-launcher" data-app="store">🛍️ &nbsp; App Store</button>
  </nav>
  <footer id="taskbar">
    <button id="start-button" aria-expanded="false" aria-controls="start-menu" aria-label="Open Start menu">⊞</button>
    <input id="search" type="search" placeholder="Search" aria-label="Search apps">
    <time id="clock"></time>
  </footer>

  <script>
    (() => {
      const desktop = document.getElementById("desktop");
      const startMenu = document.getElementById("start-menu");
      const startButton = document.getElementById("start-button");
      const windows = [...document.querySelectorAll(".window")];
      let zIndex = 20;
      const fileKey = "emulator-files";
      const appKey = "emulator-installed-apps";
      const catalog = [
        { id: "paint", name: "Paint", icon: "🎨", description: "A simple drawing workspace." },
        { id: "terminal", name: "Terminal", icon: "⌨️", description: "A simulated command prompt." },
        { id: "photos", name: "Photos", icon: "🖼️", description: "Browse your virtual pictures." }
      ];
      const installedApps = new Set(JSON.parse(localStorage.getItem(appKey) || "[]"));
      const getFiles = () => JSON.parse(localStorage.getItem(fileKey) || "[]");
      const saveFiles = (files) => localStorage.setItem(fileKey, JSON.stringify(files));

      const openApp = (name) => {
        let appWindow = document.getElementById(`window-${name}`);
        if (!appWindow && installedApps.has(name)) {
          const app = catalog.find((item) => item.id === name);
          appWindow = document.createElement("section");
          appWindow.className = "window";
          appWindow.id = `window-${name}`;
          appWindow.innerHTML = `<header class="titlebar"><strong id="${name}-title">${app.icon} ${app.name}</strong><button class="close-window" aria-label="Close ${app.name}">×</button></header><div class="window-body"><h2>${app.name}</h2><p>${app.description}</p><p>This installed app runs inside the emulator.</p></div>`;
          desktop.appendChild(appWindow);
          appWindow.querySelector(".close-window").addEventListener("click", () => appWindow.classList.remove("open"));
          appWindow.addEventListener("pointerdown", () => focusWindow(appWindow));
          makeDraggable(appWindow, appWindow.querySelector(".titlebar"), `emulator-window-${appWindow.id}`);
        }
        if (!appWindow) return;
        appWindow.classList.add("open", "active");
        appWindow.style.zIndex = ++zIndex;
        windows.filter((item) => item !== appWindow).forEach((item) => item.classList.remove("active"));
        startMenu.classList.remove("open");
        startButton.setAttribute("aria-expanded", "false");
      };

      document.addEventListener("click", (event) => {
        const launcher = event.target.closest("[data-app]");
        if (launcher) openApp(launcher.dataset.app);
      });
      startButton.addEventListener("click", () => {
        const open = startMenu.classList.toggle("open");
        startButton.setAttribute("aria-expanded", String(open));
      });
      document.addEventListener("click", (event) => {
        if (!startMenu.contains(event.target) && event.target !== startButton) {
          startMenu.classList.remove("open");
          startButton.setAttribute("aria-expanded", "false");
        }
      });
      const focusWindow = (appWindow) => {
        appWindow.style.zIndex = ++zIndex;
        document.querySelectorAll(".window").forEach((item) => item.classList.toggle("active", item === appWindow));
      };
      windows.forEach((appWindow) => {
        appWindow.addEventListener("pointerdown", () => focusWindow(appWindow));
        appWindow.querySelector(".close-window").addEventListener("click", () => appWindow.classList.remove("open"));
      });

      const makeDraggable = (element, handle, storageKey) => {
        let startX, startY, originX, originY;
        handle.addEventListener("pointerdown", (event) => {
          if (event.target.closest("button")) return;
          const rect = element.getBoundingClientRect();
          startX = event.clientX; startY = event.clientY;
          originX = rect.left; originY = rect.top;
          element.classList.add("dragging");
          handle.setPointerCapture(event.pointerId);
          const move = (moveEvent) => {
            const x = Math.max(0, Math.min(window.innerWidth - element.offsetWidth, originX + moveEvent.clientX - startX));
            const y = Math.max(0, Math.min(window.innerHeight - 70 - element.offsetHeight, originY + moveEvent.clientY - startY));
            element.style.left = `${x}px`;
            element.style.top = `${y}px`;
            element.style.transform = "none";
          };
          const end = () => {
            element.classList.remove("dragging");
            handle.removeEventListener("pointermove", move);
            handle.removeEventListener("pointerup", end);
            if (storageKey) localStorage.setItem(storageKey, JSON.stringify({ left: element.style.left, top: element.style.top }));
          };
          handle.addEventListener("pointermove", move);
          handle.addEventListener("pointerup", end, { once: true });
        });
      };
      document.querySelectorAll(".desktop-icon").forEach((icon) => {
        const saved = JSON.parse(localStorage.getItem(`emulator-icon-${icon.dataset.app}`) || "null");
        if (saved) { icon.style.left = saved.left; icon.style.top = saved.top; }
        makeDraggable(icon, icon, `emulator-icon-${icon.dataset.app}`);
      });
      document.querySelectorAll(".window").forEach((appWindow) => {
        const saved = JSON.parse(localStorage.getItem(`emulator-window-${appWindow.id}`) || "null");
        if (saved) {
          appWindow.style.left = saved.left;
          appWindow.style.top = saved.top;
          appWindow.style.transform = "none";
        }
        makeDraggable(appWindow, appWindow.querySelector(".titlebar"), `emulator-window-${appWindow.id}`);
      });

      const notes = document.querySelector(".notepad-area");
      notes.value = localStorage.getItem("emulator-notes") || "";
      document.querySelector(".save-notes").addEventListener("click", () => localStorage.setItem("emulator-notes", notes.value));
      document.querySelector(".clear-notes").addEventListener("click", () => {
        notes.value = "";
        localStorage.removeItem("emulator-notes");
      });

      const fileList = document.getElementById("file-list");
      const renderFiles = () => {
        const files = getFiles();
        fileList.innerHTML = files.length ? files.map((file, index) => `<div class="file-row"><span>📄 ${file.name}</span><button data-download="${index}">Download</button></div>`).join("") : "<p>No files yet. Upload a file or create a text file.</p>";
      };
      renderFiles();
      document.getElementById("upload-file").addEventListener("click", () => document.getElementById("file-picker").click());
      document.getElementById("file-picker").addEventListener("change", (event) => {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const files = getFiles();
          files.push({ name: file.name, type: file.type || "application/octet-stream", content: reader.result });
          saveFiles(files);
          renderFiles();
          event.target.value = "";
        };
        reader.readAsDataURL(file);
      });
      document.getElementById("new-file").addEventListener("click", () => {
        const name = `New Text Document ${getFiles().length + 1}.txt`;
        const files = getFiles();
        files.push({ name, type: "text/plain", content: `data:text/plain;charset=utf-8,${encodeURIComponent("")}` });
        saveFiles(files);
        renderFiles();
      });
      fileList.addEventListener("click", (event) => {
        const button = event.target.closest("[data-download]");
        if (!button) return;
        const file = getFiles()[Number(button.dataset.download)];
        if (!file) return;
        const link = document.createElement("a");
        link.href = file.content;
        link.download = file.name;
        link.click();
      });

      const storeGrid = document.getElementById("store-grid");
      const renderStore = () => {
        storeGrid.innerHTML = catalog.map((app) => installedApps.has(app.id)
          ? `<article class="store-card"><h3>${app.icon} ${app.name}</h3><p>${app.description}</p><span class="installed">Installed</span></article>`
          : `<article class="store-card"><h3>${app.icon} ${app.name}</h3><p>${app.description}</p><button data-install="${app.id}" class="primary">Install</button></article>`).join("");
      };
      renderStore();
      const addAppLauncher = (app) => {
        const menuButton = document.createElement("button");
        menuButton.className = "app-launcher";
        menuButton.dataset.app = app.id;
        menuButton.textContent = `${app.icon}  ${app.name}`;
        startMenu.appendChild(menuButton);
        const icon = document.createElement("button");
        icon.className = "desktop-icon";
        icon.dataset.app = app.id;
        icon.style.left = "112px";
        icon.style.top = `${18 + document.querySelectorAll(".desktop-icon").length * 94}px`;
        icon.innerHTML = `<span class="glyph" aria-hidden="true">${app.icon}</span><span>${app.name}</span>`;
        desktop.appendChild(icon);
        makeDraggable(icon, icon, `emulator-icon-${app.id}`);
      };
      catalog.filter((app) => installedApps.has(app.id)).forEach(addAppLauncher);
      storeGrid.addEventListener("click", (event) => {
        const button = event.target.closest("[data-install]");
        if (!button) return;
        const app = catalog.find((item) => item.id === button.dataset.install);
        if (!app || installedApps.has(app.id)) return;
        installedApps.add(app.id);
        localStorage.setItem(appKey, JSON.stringify([...installedApps]));
        addAppLauncher(app);
        renderStore();
      });

      const display = document.getElementById("calc-display");
      const calcError = document.getElementById("calc-error");
      const calculate = () => {
        if (!/^[0-9+*/().\s-]+$/.test(display.value) || !display.value.trim()) return;
        try {
          const result = Function(`"use strict"; return (${display.value})`)();
          if (!Number.isFinite(result)) throw new Error("Invalid result");
          display.value = String(result);
          calcError.textContent = "";
        } catch {
          calcError.textContent = "Enter a valid calculation.";
        }
      };
      document.querySelectorAll("[data-calc]").forEach((button) => button.addEventListener("click", () => {
        if (button.dataset.calc === "=") calculate();
        else display.value += button.dataset.calc;
      }));
      document.getElementById("calc-clear").addEventListener("click", () => {
        display.value = "";
        calcError.textContent = "";
      });

      const savedAccent = localStorage.getItem("emulator-accent");
      const accentColor = document.getElementById("accent-color");
      const contrastToggle = document.getElementById("contrast-toggle");
      if (savedAccent) {
        document.documentElement.style.setProperty("--accent", savedAccent);
        accentColor.value = savedAccent;
      }
      accentColor.addEventListener("input", () => {
        document.documentElement.style.setProperty("--accent", accentColor.value);
        localStorage.setItem("emulator-accent", accentColor.value);
      });
      contrastToggle.addEventListener("change", () => {
        document.documentElement.style.setProperty("--surface", contrastToggle.checked ? "#fff" : "#f3f3f3");
        localStorage.setItem("emulator-contrast", String(contrastToggle.checked));
      });
      contrastToggle.checked = localStorage.getItem("emulator-contrast") === "true";
      contrastToggle.dispatchEvent(new Event("change"));

      const clock = document.getElementById("clock");
      const updateClock = () => {
        clock.textContent = new Intl.DateTimeFormat([], { hour: "numeric", minute: "2-digit" }).format(new Date());
      };
      updateClock();
      setInterval(updateClock, 30000);

      document.getElementById("search").addEventListener("input", (event) => {
        const query = event.target.value.toLowerCase();
        document.querySelectorAll(".app-launcher").forEach((item) => {
          item.hidden = !item.textContent.toLowerCase().includes(query);
        });
        startMenu.classList.add("open");
        startButton.setAttribute("aria-expanded", "true");
      });
    })();
  </script>
</body>
</html>
